<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineVerse — Trending Hollywood Movies</title>
<meta name="description" content="Discover trending and latest Hollywood movies. Ratings, trailers, genres, watchlist and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08080d; --bg2:#0e0e16; --card:#14141d; --line:#23232f;
    --ink:#f4f4f8; --muted:#9a9aad; --red:#e50914; --gold:#f5c518;
    --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  h1,h2,h3,.bebas{font-family:'Bebas Neue',sans-serif;letter-spacing:1.5px;font-weight:400}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1240px;margin:0 auto;padding:0 24px}
  ::selection{background:var(--red);color:#fff}

  /* ---------- NAV ---------- */
  nav{position:fixed;top:0;left:0;right:0;z-index:60;transition:.35s;background:linear-gradient(180deg,rgba(8,8,13,.9),transparent)}
  nav.scrolled{background:rgba(8,8,13,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .nav-in{display:flex;align-items:center;gap:32px;padding:16px 0}
  .logo{font-family:'Bebas Neue';font-size:30px;letter-spacing:2px;color:#fff}
  .logo b{color:var(--red)}
  .nav-links{display:flex;gap:26px;font-size:14px;font-weight:600;color:#cfcfdd}
  .nav-links a{transition:.2s;padding:6px 2px;position:relative}
  .nav-links a::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--red);transition:.25s}
  .nav-links a:hover{color:#fff}
  .nav-links a:hover::after{width:100%}
  .search{margin-left:auto;display:flex;align-items:center;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:8px 18px;gap:10px;min-width:230px;transition:.25s}
  .search:focus-within{border-color:var(--red);background:rgba(255,255,255,.1)}
  .search input{background:none;border:none;outline:none;color:#fff;font-size:14px;width:100%;font-family:inherit}
  .search input::placeholder{color:#6a6a80}

  /* ---------- HERO CAROUSEL ---------- */
  .hero{position:relative;min-height:96vh;display:flex;align-items:flex-end;overflow:hidden;background:#0a0a12}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity 1s ease}
  .slide.on{opacity:1}
  .slide img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%}
  .slide .shade{position:absolute;inset:0;background:
    linear-gradient(90deg,rgba(8,8,13,.95) 0%,rgba(8,8,13,.55) 45%,rgba(8,8,13,.15) 100%),
    linear-gradient(0deg,var(--bg) 2%,transparent 45%,rgba(8,8,13,.5) 100%)}
  .slide.fallback{background:radial-gradient(1000px 520px at 75% 15%,rgba(229,9,20,.25),transparent 60%),radial-gradient(800px 500px at 10% 90%,rgba(90,40,160,.28),transparent 60%),#0b0b14}
  .hero-in{position:relative;z-index:3;padding:120px 0;max-width:1240px;margin:0 auto;width:100%}
  .hero-copy{max-width:640px;animation:rise .7s ease}
  @keyframes rise{from{transform:translateY(26px);opacity:0}}
  .kicker{display:inline-flex;align-items:center;gap:10px;background:rgba(229,9,20,.16);border:1px solid rgba(229,9,20,.5);color:#ff9a9a;font-size:12px;font-weight:800;letter-spacing:2.5px;padding:8px 18px;border-radius:999px;text-transform:uppercase}
  .kicker .dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1.6s infinite}
  @keyframes blink{50%{opacity:.25}}
  .hero h1{font-size:clamp(54px,9vw,118px);line-height:.95;margin:20px 0 8px;color:#fff;text-shadow:0 6px 40px rgba(0,0,0,.6)}
  .hero h1 span{color:var(--red)}
  .hmeta{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:14px 0 18px;font-size:15px;color:#d6d6e2;font-weight:600}
  .hmeta .rate{color:var(--gold);font-weight:800;font-size:17px}
  .hmeta .tag{border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:3px 12px;font-size:13px;background:rgba(255,255,255,.06)}
  .hero p.lead{color:#d0d0de;font-size:17px;margin-bottom:32px;text-shadow:0 2px 12px rgba(0,0,0,.7)}
  .btn{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:15px;padding:15px 34px;border-radius:10px;transition:.25s;border:none;cursor:pointer;font-family:inherit}
  .btn-red{background:var(--red);color:#fff;box-shadow:0 12px 30px rgba(229,9,20,.4)}
  .btn-red:hover{transform:translateY(-2px);box-shadow:0 18px 44px rgba(229,9,20,.6)}
  .btn-ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);margin-left:12px;backdrop-filter:blur(6px)}
  .btn-ghost:hover{background:rgba(255,255,255,.2)}
  .hero-ui{position:absolute;z-index:4;bottom:34px;right:0;left:0}
  .hero-ui .wrap{display:flex;align-items:center;justify-content:space-between}
  .dots{display:flex;gap:10px}
  .dotb{width:34px;height:5px;border-radius:99px;background:rgba(255,255,255,.22);border:none;cursor:pointer;transition:.3s;padding:0}
  .dotb.on{background:var(--red);width:52px}
  .harrows{display:flex;gap:10px}
  .rbtn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.4);backdrop-filter:blur(8px);color:#fff;font-size:19px;cursor:pointer;transition:.2s;display:grid;place-items:center}
  .rbtn:hover{background:var(--red);border-color:var(--red)}

  /* ---------- SECTIONS ---------- */
  section{padding:66px 0 8px}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
  .sec-head h2{font-size:40px;color:#fff}
  .sec-head h2 em{color:var(--red);font-style:normal}
  .rv{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease}
  .rv.vis{opacity:1;transform:none}

  /* ---------- STATS ---------- */
  .stats{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg2)}
  .stats-in{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));text-align:center;padding:30px 0;gap:16px}
  .stats b{font-size:32px;display:block;color:#fff;font-family:'Bebas Neue';letter-spacing:1px}
  .stats b i{color:var(--red);font-style:normal}
  .stats small{color:var(--muted);font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase}

  /* ---------- MOVIE ROWS / CARDS ---------- */
  .row{overflow:hidden}
  .track{display:flex;gap:18px;overflow-x:auto;padding:6px 2px 24px;scroll-behavior:smooth;scrollbar-width:none}
  .track::-webkit-scrollbar{display:none}
  .card{flex:0 0 180px;cursor:pointer;transition:transform .3s cubic-bezier(.2,.7,.3,1.2)}
  .card:hover{transform:translateY(-8px) scale(1.03)}
  .poster{position:relative;aspect-ratio:2/3;border-radius:var(--radius);overflow:hidden;background:linear-gradient(135deg,#1c1c2a,#2b1a3a);border:1px solid var(--line);box-shadow:0 14px 34px rgba(0,0,0,.5)}
  .poster::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.09) 50%,transparent 70%);background-size:200% 100%;animation:shim 1.6s infinite}
  @keyframes shim{to{background-position:-200% 0}}
  .poster.ld::after,.poster.noimg::after{display:none}
  .poster img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s,transform .4s}
  .poster img.ld{opacity:1}
  .card:hover .poster img{transform:scale(1.07)}
  .poster .ptitle{display:none;position:absolute;inset:0;place-items:center;text-align:center;padding:18px;font-family:'Bebas Neue';font-size:26px;letter-spacing:1px;color:#fff}
  .poster.noimg .ptitle{display:grid}
  .poster.noimg{background:linear-gradient(135deg,#3a0d16,#1c1c2a 60%,#0e2a4a)}
  .badge{position:absolute;font-size:12px;font-weight:800;padding:5px 11px;border-radius:8px;backdrop-filter:blur(6px);z-index:2}
  .rating{top:10px;left:10px;background:rgba(0,0,0,.72);color:var(--gold);border:1px solid rgba(245,197,24,.35)}
  .age{bottom:10px;left:10px;background:rgba(0,0,0,.72);color:#fff;border:1px solid rgba(255,255,255,.3)}
  .qual{bottom:10px;right:10px;background:rgba(229,9,20,.85);color:#fff;letter-spacing:1px}
  .bm{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:16px;cursor:pointer;z-index:3;opacity:0;transform:translateY(-6px);transition:.25s;display:grid;place-items:center}
  .card:hover .bm{opacity:1;transform:none}
  .bm.saved{opacity:1;transform:none;background:var(--red);border-color:var(--red)}
  .bm:hover{background:var(--red)}
  .play{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:.3s;background:rgba(0,0,0,.45);z-index:1}
  .card:hover .play{opacity:1}
  .play span{width:56px;height:56px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-size:20px;color:#fff;box-shadow:0 10px 26px rgba(229,9,20,.6)}
  .cmeta{padding:12px 4px 0}
  .cmeta h4{font-size:15px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cmeta small{color:var(--muted);font-size:12.5px}

  /* ---------- TOP 10 ---------- */
  .top10 .card{flex:0 0 252px;display:flex;align-items:center}
  .rank{font-family:'Bebas Neue';font-size:112px;line-height:1;color:transparent;-webkit-text-stroke:2px #3d3d52;flex-shrink:0;margin-right:-16px;transition:.3s}
  .top10 .card:hover .rank{-webkit-text-stroke:2px var(--red);transform:scale(1.05)}
  .top10 .poster{flex:0 0 130px}

  /* ---------- GRID + FILTERS ---------- */
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
  .chip{background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:13.5px;font-weight:600;padding:9px 20px;border-radius:999px;cursor:pointer;transition:.2s;font-family:inherit}
  .chip:hover{color:#fff;border-color:#4a4a5e;transform:translateY(-1px)}
  .chip.on{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 6px 18px rgba(229,9,20,.4)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(174px,1fr));gap:22px;padding-bottom:30px}
  .grid .card{flex:none}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:56px 0;font-size:16px}
  .empty .big{font-size:44px;display:block;margin-bottom:10px}

  /* ---------- COMING SOON ---------- */
  .soon-card{flex:0 0 300px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:.3s}
  .soon-card:hover{transform:translateY(-6px);border-color:#3d3d52;box-shadow:0 18px 44px rgba(0,0,0,.5)}
  .soon-top{height:150px;display:grid;place-items:center;background:linear-gradient(135deg,#2b1030,#101a3a 60%,#0d2b1d);position:relative;overflow:hidden}
  .soon-top::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,transparent,transparent 4px,rgba(255,255,255,.03) 4px,rgba(255,255,255,.03) 5px)}
  .soon-top .t{font-family:'Bebas Neue';font-size:30px;letter-spacing:2px;color:#fff;text-align:center;padding:0 20px;position:relative;text-shadow:0 4px 20px rgba(0,0,0,.6)}
  .date{position:absolute;top:12px;left:12px;background:var(--red);color:#fff;font-size:11.5px;font-weight:800;letter-spacing:1.5px;padding:6px 13px;border-radius:8px}
  .soon-body{padding:20px 22px 24px}
  .soon-body h4{font-size:17px;color:#fff;margin-bottom:4px}
  .soon-body small{color:var(--muted);font-size:12.5px;display:block;margin-bottom:10px}
  .soon-body p{color:#a9a9bd;font-size:13.5px}
  .notify{margin-top:14px;width:100%;background:rgba(229,9,20,.12);border:1px solid rgba(229,9,20,.45);color:#ff9a9a;font-weight:700;font-size:13.5px;padding:11px;border-radius:10px;cursor:pointer;transition:.2s;font-family:inherit}
  .notify:hover{background:var(--red);color:#fff}
  .notify.done{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.5);color:#7ee2a8}

  /* ---------- MODAL ---------- */
  .modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
  .modal.open{display:flex}
  .mback{position:absolute;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(8px)}
  .mbox{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:20px;max-width:780px;width:100%;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.7);animation:pop .32s cubic-bezier(.2,.7,.3,1.2);max-height:92vh;overflow-y:auto}
  @keyframes pop{from{transform:scale(.93) translateY(16px);opacity:0}}
  .mbanner{position:relative;height:220px;background:linear-gradient(135deg,#2b1030,#101a3a)}
  .mbanner img{width:100%;height:100%;object-fit:cover;object-position:center 25%}
  .mbanner::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg2) 4%,transparent 60%)}
  .mrow{display:flex;gap:28px;padding:0 34px 34px;margin-top:-70px;position:relative}
  .mbox .poster{flex:0 0 168px;aspect-ratio:2/3;box-shadow:0 20px 50px rgba(0,0,0,.6)}
  .mbody{flex:1;padding-top:76px}
  .mbody h2{font-size:42px;line-height:1;color:#fff}
  .mbody .hmeta{margin:10px 0 14px}
  .mbody p{color:#b9b9c9;font-size:15px;margin-bottom:24px}
  .mclose{position:absolute;top:14px;right:16px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.6);border:1px solid var(--line);color:#fff;font-size:18px;cursor:pointer;z-index:5;transition:.2s}
  .mclose:hover{background:var(--red);transform:rotate(90deg)}
  .mbtns{display:flex;gap:12px;flex-wrap:wrap}
  .btn-list{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff}
  .btn-list:hover{background:rgba(255,255,255,.16)}
  .btn-list.saved{background:var(--red);border-color:var(--red)}

  footer{margin-top:70px;border-top:1px solid var(--line);padding:38px 0;color:var(--muted);font-size:13.5px}
  .foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
  .foot .logo{font-size:24px}

  @media(max-width:760px){
    .nav-links{display:none}
    .search{min-width:0;flex:1}
    .hero h1{font-size:62px}
    .mrow{flex-direction:column;padding:0 24px 28px}
    .mbox .poster{flex:none;width:150px;margin-top:-60px}
    .mbody{padding-top:0}
    .hero-ui .harrows{display:none}
  }
</style>
</head>
<body>

<nav id="nav">
  <div class="wrap nav-in">
    <a class="logo" href="#">CINE<b>VERSE</b></a>
    <div class="nav-links">
      <a href="#trending">Trending</a>
      <a href="#top10">Top 10</a>
      <a href="#latest">Latest</a>
      <a href="#coming">Coming Soon</a>
      <a href="#mylist">My List <span id="listCount" style="color:var(--red)"></span></a>
    </div>
    <label class="search">🔍 <input id="search" type="text" placeholder="Search movies..."></label>
  </div>
</nav>

<header class="hero" id="hero">
  <div id="slides"></div>
  <div class="wrap hero-in"><div class="hero-copy" id="heroCopy"></div></div>
  <div class="hero-ui"><div class="wrap">
    <div class="dots" id="dots"></div>
    <div class="harrows"><button class="rbtn" onclick="heroGo(-1)">‹</button><button class="rbtn" onclick="heroGo(1)">›</button></div>
  </div></div>
</header>

<div class="stats rv">
  <div class="wrap stats-in">
    <div><b><i>16</i>+</b><small>Movies Listed</small></div>
    <div><b><i>8.6</i></b><small>Top Rated</small></div>
    <div><b><i>4K</i></b><small>Ultra HD</small></div>
    <div><b><i>∞</i></b><small>Free Trailers</small></div>
  </div>
</div>

<section id="trending">
  <div class="wrap rv">
    <div class="sec-head">
      <h2>TRENDING <em>NOW</em></h2>
      <div class="row-btns"><button class="rbtn" onclick="scrollRow('rowTrending',-1)">‹</button><button class="rbtn" onclick="scrollRow('rowTrending',1)">›</button></div>
    </div>
    <div class="row"><div class="track" id="rowTrending"></div></div>
  </div>
</section>

<section id="top10">
  <div class="wrap rv">
    <div class="sec-head">
      <h2>TOP 10 <em>THIS WEEK</em></h2>
      <div class="row-btns"><button class="rbtn" onclick="scrollRow('rowTop',-1)">‹</button><button class="rbtn" onclick="scrollRow('rowTop',1)">›</button></div>
    </div>
    <div class="row top10"><div class="track" id="rowTop"></div></div>
  </div>
</section>

<section id="latest">
  <div class="wrap rv">
    <div class="sec-head"><h2>LATEST <em>RELEASES</em></h2></div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
  </div>
</section>

<section id="coming">
  <div class="wrap rv">
    <div class="sec-head">
      <h2>COMING <em>SOON</em></h2>
      <div class="row-btns"><button class="rbtn" onclick="scrollRow('rowSoon',-1)">‹</button><button class="rbtn" onclick="scrollRow('rowSoon',1)">›</button></div>
    </div>
    <div class="row"><div class="track" id="rowSoon"></div></div>
  </div>
</section>

<section id="mylist">
  <div class="wrap rv">
    <div class="sec-head"><h2>MY <em>LIST</em></h2></div>
    <div class="grid" id="myListGrid"></div>
  </div>
</section>

<div class="modal" id="modal">
  <div class="mback" onclick="closeModal()"></div>
  <div class="mbox">
    <button class="mclose" onclick="closeModal()">✕</button>
    <div class="mbanner" id="mBanner"></div>
    <div class="mrow">
      <div class="poster" id="mPoster"></div>
      <div class="mbody" id="mBody"></div>
    </div>
  </div>
</div>

<footer>
  <div class="wrap foot">
    <a class="logo" href="#">CINE<b>VERSE</b></a>
    <span>Posters via TMDB. Demo showcase page — all rights belong to their respective studios.</span>
    <span>© 2026 CineVerse</span>
  </div>
</footer>

   rank: 1-10 Top 10 ka order. age: "PG-13" jaisa rating.
============================================================ */

const IMG_BG = 'https://image.tmdb.org/t/p/w1280';
const MOVIES = [

  {id:4, title:"Joker", year:2019, rating:8.2, dur:"2h 2m", genre:"Crime/Drama", age:"R", quality:"4K",
   poster:"/udDclJoHjfjb8Ekgsd4FDteOkCU.jpg", rank:4, tag:"Trending",
   desc:"A failed comedian, isolated and disregarded by society, begins a slow descent into madness as he transforms into the Joker."},
  {id:5, title:"The Batman", year:2022, rating:7.7, dur:"2h 56m", genre:"Crime/Mystery", age:"PG-13", quality:"4K",
   poster:"/74xTEgt7R36Fpooo50r9T25onhq.jpg", rank:5, tag:"Trending",

/* EDIT: aanay wali movies yahan — date format "DEC 2025" jaisa rakho */
const UPCOMING = [
  {title:"Avatar: Fire and Ash", date:"DEC 2025", genre:"Sci-Fi / Adventure",
   desc:"Jake Sully and Neytiri face a new aggressive Na'vi clan as the war for Pandora escalates."},
  {title:"Avengers: Doomsday", date:"DEC 2026", genre:"Action / Sci-Fi",
   desc:"Earth's mightiest heroes assemble against Doctor Doom in the MCU's biggest crossover yet."},
  {title:"The Mandalorian and Grogu", date:"MAY 2026", genre:"Sci-Fi / Adventure",
   desc:"Din Djarin and Grogu take their first big-screen bounty-hunting adventure across the galaxy."},
  {title:"Toy Story 5", date:"JUN 2026", genre:"Animation / Family",
   desc:"Woody, Buzz and the gang return as Bonnie faces a new tech-obsessed world of toys."},
];

const GENRES = ["All","Action","Sci-Fi","Drama","Crime","Comedy","Adventure","Animation"];
let activeGenre = "All";
let myList = JSON.parse(localStorage.getItem('cineverse_list')||'[]');
let heroIdx = 0, heroTimer = null;
const FEATURED = MOVIES.filter(m=>m.featured);

const resolveURL = (p, prefix) => {
  if(!p) return '';
  if(p.startsWith('http') || !p.startsWith('/')) return p; // poora link ya local file
  return prefix + p; // TMDB path
};
const pURL = m => resolveURL(m.poster, IMG);
const bgURL = m => resolveURL(m.backdrop, IMG_BG);
const isSaved = id => myList.includes(id);
const trailerURL = t => "https://www.youtube.com/results?search_query="+encodeURIComponent(t+" official trailer");
/* EDIT: "Watch Now" button ka link — apna link yahan badlo */
const WATCH_URL = "https://www.profitableratecpmnetwork.com/a4e6crx0?key=7ab8ce72e35e589a0d25de2588728d80";

function saveList(){ localStorage.setItem('cineverse_list', JSON.stringify(myList)); renderMyList(); updateCount(); }
function updateCount(){ document.getElementById('listCount').textContent = myList.length?`(${myList.length})`:''; }
function toggleList(id, ev){
  if(ev){ ev.stopPropagation(); }
  myList = isSaved(id) ? myList.filter(x=>x!==id) : [...myList, id];
  saveList(); render();
}

/* ---------- HERO ---------- */
function renderHero(){
  const box = document.getElementById('slides');
  box.innerHTML = FEATURED.map((m,i)=>`
    <div class="slide ${i===0?'on':''} ${m.backdrop?'':'fallback'}" data-i="${i}">
      ${m.backdrop?`<img class="bg" src="${bgURL(m)}" alt="" onerror="this.closest('.slide').classList.add('fallback');this.remove()">`:''}
      <div class="shade"></div>
    </div>`).join('');
  document.getElementById('dots').innerHTML = FEATURED.map((_,i)=>
    `<button class="dotb ${i===0?'on':''}" onclick="heroGoTo(${i})" aria-label="Slide ${i+1}"></button>`).join('');
  heroCopy(0); heroAuto();
}
function heroCopy(i){
  const m = FEATURED[i];
  const tp = m.title.split(':');
  const h1 = tp.length>1 ? `${tp[0].toUpperCase()} <span>${tp.slice(1).join(':').trim().toUpperCase()}</span>` : m.title.toUpperCase();
  document.getElementById('heroCopy').innerHTML = `
    <span class="kicker"><span class="dot"></span>Trending #${m.rank} this week</span>
    <h1>${h1}</h1>
    <div class="hmeta"><span class="rate">★ ${m.rating.toFixed(1)}</span><span>${m.year}</span><span>${m.dur}</span>
      <span class="tag">${m.age}</span><span class="tag">${m.genre}</span><span class="tag">${m.quality}</span></div>
    <p class="lead">${m.desc}</p>
    <div>
      <a class="btn btn-red" href="${WATCH_URL}" target="_blank" rel="noopener">▶ Watch Now</a>
      <a class="btn btn-ghost" href="${trailerURL(m.title)}" target="_blank" rel="noopener">Trailer</a>
      <button class="btn btn-ghost" onclick="openModal(${m.id})">More Info</button>
    </div>`;
  const el = document.getElementById('heroCopy');
  el.style.animation='none'; void el.offsetWidth; el.style.animation='';
}
function heroGoTo(i){
  heroIdx = (i+FEATURED.length)%FEATURED.length;
  document.querySelectorAll('.slide').forEach((s,k)=>s.classList.toggle('on',k===heroIdx));
  document.querySelectorAll('.dotb').forEach((d,k)=>d.classList.toggle('on',k===heroIdx));
  heroCopy(heroIdx); heroAuto();
}
function heroGo(d){ heroGoTo(heroIdx+d); }
function heroAuto(){
  clearInterval(heroTimer);
  heroTimer = setInterval(()=>heroGo(1), 6500);
}
document.getElementById('hero').addEventListener('mouseenter',()=>clearInterval(heroTimer));
document.getElementById('hero').addEventListener('mouseleave',heroAuto);

/* ---------- CARDS / ROWS ---------- */
function posterHTML(m){
  const saved = isSaved(m.id);
  return `<div class="poster">
    <img src="${pURL(m)}" alt="${m.title}" loading="lazy" onload="this.classList.add('ld');this.parentNode.classList.add('ld')" onerror="this.parentNode.classList.add('noimg');this.remove()">
    <span class="ptitle">${m.title}</span>
    <span class="badge rating">★ ${m.rating.toFixed(1)}</span>
    <button class="bm ${saved?'saved':''}" onclick="toggleList(${m.id},event)" title="My List">${saved?'✓':'+'}</button>
    <span class="badge age">${m.age||'PG'}</span>
    <span class="badge qual">${m.quality||'HD'}</span>
    <span class="play"><span>▶</span></span>
  </div>`;
}
function cardHTML(m){
  return `<div class="card" onclick="openModal(${m.id})">${posterHTML(m)}
    <div class="cmeta"><h4>${m.title}</h4><small>${m.year} · ${m.genre.split('/')[0]}</small></div></div>`;
}
function topHTML(m){
  return `<div class="card" onclick="openModal(${m.id})"><div class="rank">${m.rank}</div>${posterHTML(m)}</div>`;
}
function soonHTML(u,i){
  const done = localStorage.getItem('cineverse_notify_'+i)==='1';
  return `<div class="soon-card">
    <div class="soon-top"><span class="date">${u.date}</span><span class="t">${u.title.toUpperCase()}</span></div>
    <div class="soon-body"><h4>${u.title}</h4><small>${u.genre}</small><p>${u.desc}</p>
      <button class="notify ${done?'done':''}" onclick="notifyMe(${i},this)">${done?'✓ Reminder Set':'🔔 Notify Me'}</button>
    </div></div>`;
}
function notifyMe(i,btn){
  localStorage.setItem('cineverse_notify_'+i,'1');
  btn.classList.add('done'); btn.textContent='✓ Reminder Set';
}
function matches(m,q){
  return (activeGenre==="All"||m.genre.includes(activeGenre)) && (!q||m.title.toLowerCase().includes(q.toLowerCase()));
}
function render(){
  const q = document.getElementById('search').value.trim();
  document.getElementById('rowTrending').innerHTML =
    MOVIES.filter(m=>m.tag==="Trending").sort((a,b)=>a.rank-b.rank).map(cardHTML).join('');
  document.getElementById('rowTop').innerHTML =
    [...MOVIES].sort((a,b)=>a.rank-b.rank).slice(0,10).map(topHTML).join('');
  const list = MOVIES.filter(m=>matches(m,q));
  document.getElementById('grid').innerHTML = list.length ? list.map(cardHTML).join('')
    : `<div class="empty"><span class="big">🎬</span>No movies found. Try another search.</div>`;
  document.getElementById('chips').innerHTML = GENRES.map(g=>
    `<button class="chip ${g===activeGenre?'on':''}" onclick="setGenre('${g}')">${g}</button>`).join('');
  document.getElementById('rowSoon').innerHTML = UPCOMING.map(soonHTML).join('');
  renderMyList(); updateCount();
}
function renderMyList(){
  const list = MOVIES.filter(m=>isSaved(m.id));
  document.getElementById('myListGrid').innerHTML = list.length ? list.map(cardHTML).join('')
    : `<div class="empty"><span class="big">🔖</span>Your list is empty. Tap <b>+</b> on any movie poster to save it here.</div>`;
}
function setGenre(g){ activeGenre=g; render(); }
function scrollRow(id,dir){ document.getElementById(id).scrollBy({left:dir*560,behavior:'smooth'}); }

/* ---------- MODAL ---------- */
function openModal(id){
  const m = MOVIES.find(x=>x.id===id); if(!m) return;
  const saved = isSaved(id);
  document.getElementById('mBanner').innerHTML = m.backdrop
    ? `<img src="${bgURL(m)}" alt="" onerror="this.remove()">` : '';
  document.getElementById('mPoster').innerHTML =
    `<img src="${pURL(m)}" alt="${m.title}" onload="this.classList.add('ld');this.parentNode.classList.add('ld')" onerror="this.parentNode.classList.add('noimg');this.remove()">
     <span class="ptitle">${m.title}</span><span class="badge rating">★ ${m.rating.toFixed(1)}</span>`;
  document.getElementById('mBody').innerHTML = `
    <h2 class="bebas">${m.title.toUpperCase()}</h2>
    <div class="hmeta"><span class="rate" style="color:var(--gold);font-weight:800">★ ${m.rating.toFixed(1)}</span>
      <span>${m.year}</span><span>${m.dur}</span><span class="tag">${m.age||'PG'}</span>
      <span class="tag">${m.genre}</span><span class="tag">${m.quality||'HD'}</span></div>
    <p>${m.desc}</p>
    <div class="mbtns">
      <a class="btn btn-red" href="${WATCH_URL}" target="_blank" rel="noopener">▶ Watch Now</a>
      <a class="btn btn-ghost" href="${trailerURL(m.title)}" target="_blank" rel="noopener">Trailer</a>
      <button class="btn btn-list ${saved?'saved':''}" onclick="toggleList(${m.id},event);openModal(${m.id})">${saved?'✓ In My List':'+ My List'}</button>
    </div>`;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow='';
}

/* ---------- FX ---------- */
window.addEventListener('scroll',()=>{
  document.getElementById('nav').classList.toggle('scrolled', window.scrollY>40);
},{passive:true});
const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('vis'); io.unobserve(e.target);} }),{threshold:.08});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));
document.getElementById('search').addEventListener('input',render);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

renderHero();
render();
</script>
</body>
