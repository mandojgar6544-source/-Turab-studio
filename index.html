<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Offer Title</title>

  <!-- ===== Facebook preview (yahan apna title/description likho) ===== -->
  <meta property="og:title" content="Your Offer Title" />
  <meta property="og:description" content="Short description about your offer..." />
  <meta property="og:type" content="website" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    h1 { font-size: 26px; margin-bottom: 12px; }
    p { font-size: 15px; line-height: 1.6; opacity: 0.85; margin-bottom: 28px; }
    a.btn {
      display: inline-block;
      background: #ff6b35;
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      padding: 14px 48px;
      border-radius: 50px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    a.btn:hover { transform: scale(1.04); box-shadow: 0 8px 24px rgba(255,107,53,0.4); }
    .note { margin-top: 24px; font-size: 12px; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="card">
    <!-- ===== EDIT KARO: apna title yahan ===== -->
    <h1>Your Offer Title</h1>

    <!-- ===== EDIT KARO: apni description yahan ===== -->
    <p>Short description about your offer. 2-3 lines mein likho ke visitor ko kya milega.</p>

    <!-- ===== Button: neeche wale link ko apne affiliate link se badal do ===== -->
    <a class="btn" href="https://www.profitableratecpmnetwork.com/a4e6crx0?key=7ab8ce72e35e589a0d25de2588728d80" target="_blank" rel="noopener">Continue &rarr;</a>

    <div class="note">100% free &bull; No signup needed</div>
  </div>
</body>
</html>
